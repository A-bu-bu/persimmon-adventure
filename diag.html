<!DOCTYPE html>
<html lang=zh-TW>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0>
  <title>Firebase Sync Diagnostic</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1a1a2e; color: white; }
    .status { padding: 10px; margin: 10px 0; border-radius: 8px; font-size: 16px; }
    .ok { background: #2d5a27; }
    .err { background: #5a2727; }
    .info { background: #27405a; }
    button { padding: 12px 20px; font-size: 16px; margin: 8px 4px; border-radius: 8px; cursor: pointer; }
    input { padding: 10px; font-size: 16px; width: 200px; border-radius: 8px; margin: 4px; }
  </style>
</head>
<body>
  <h2>Firebase 雲端同步診斷</h2>
  <div id=log></div>
  <br>
  <input id=username placeholder=輸入帳號 (例: apple)>
  <button onclick=testWrite()>寫入測試存檔</button>
  <button onclick=testRead()>讀取雲端存檔</button>
  <button onclick=clearLog()>清除</button>
  <script src=https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js></script>
  <script src=https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js></script>
  <script>
    function log(msg, type) {
      const d = document.createElement('div');
      d.className = 'status ' + (type || 'info');
      d.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
      document.getElementById('log').prepend(d);
      console.log(msg);
    }
    function clearLog() { document.getElementById('log').innerHTML = ''; }

    const config = {
      apiKey: AIzaSyC3p5wUP1-qKChfEmwUgDS-oGNRH9M-4yA,
      authDomain: persimmon-adventure.firebaseapp.com,
      projectId: persimmon-adventure,
      storageBucket: persimmon-adventure.firebasestorage.app,
      messagingSenderId: 572634712592,
      appId: 1:572634712592:web:301ef8b48b5731facb9895
    };

    let db;
    try {
      firebase.initializeApp(config);
      db = firebase.firestore();
      log('✅ Firebase 初始化成功!', 'ok');
    } catch(e) {
      log('❌ Firebase 初始化失敗: ' + e.message, 'err');
    }

    async function testWrite() {
      const name = document.getElementById('username').value.trim() || 'test_user';
      try {
        log('正在寫入帳號 ' + name + ' 的測試資料...');
        await db.collection('profiles').doc(name).set({
          username: name, highestLevel: 3, totalCoins: 22, _testWrite: Date.now()
        }, { merge: true });
        log('✅ 寫入成功! 帳號: ' + name + ', 第3關, 金幣22', 'ok');
      } catch(e) {
        log('❌ 寫入失敗: ' + e.message, 'err');
      }
    }

    async function testRead() {
      const name = document.getElementById('username').value.trim() || 'apple';
      try {
        log('正在讀取帳號 ' + name + ' 的雲端資料...');
        const doc = await db.collection('profiles').doc(name).get();
        if (doc.exists) {
          const d = doc.data();
          log('✅ 讀取成功! 第' + d.highestLevel + '關, 金幣$' + d.totalCoins, 'ok');
          log('完整資料: ' + JSON.stringify(d).substring(0, 200));
        } else {
          log('⚠️ 雲端無此帳號的存檔: ' + name, 'err');
        }
      } catch(e) {
        log('❌ 讀取失敗: ' + e.message, 'err');
      }
    }
  </script>
</body>
</html>
